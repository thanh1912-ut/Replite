name: Verified pretrained weights

on:
  workflow_dispatch:

jobs:
  network-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install ".[test]"
      - name: Download, hash, and strict-load pinned weights
        run: python -m pytest -q -m network

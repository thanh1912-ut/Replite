name: CPU CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]" "build>=1.2,<2" "twine>=6,<7"
      - name: Dependency check
        run: python -m pip check
      - name: Unit and export tests
        run: python -m pytest -q -m "not network and not cuda"
      - name: Build and inspect package
        run: |
          python -m build
          python -m twine check dist/*

  torch-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - torch-version: "2.11.*"
            torchvision-version: "0.26.*"
            expected-torch-prefix: "2.11."
          - torch-version: "2.13.*"
            torchvision-version: "0.28.*"
            expected-torch-prefix: "2.13."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install selected Torch and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "torch==${{ matrix.torch-version }}" \
            "torchvision==${{ matrix.torchvision-version }}"
          python -m pip install ".[test]"
      - name: Assert selected Torch was not upgraded
        env:
          EXPECTED_TORCH_PREFIX: ${{ matrix.expected-torch-prefix }}
        run: |
          python -c "import os, torch; assert torch.__version__.startswith(os.environ['EXPECTED_TORCH_PREFIX']), torch.__version__"
      - name: Compatibility suite
        run: python -m pytest -q -m "not network and not cuda"

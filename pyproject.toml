[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "replite-backbone"
version = "0.3.0"
description = "Lightweight recurrent multi-task perception model with MobileNetV3/V4 backbones."
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
dependencies = [
    "numpy>=1.26,<3",
    "Pillow>=10,<13",
    "torch>=2.11,<2.14",
    "timm==1.0.28",
    "huggingface_hub>=0.34,<2",
    "safetensors>=0.5,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "onnx>=1.17,<2",
    "onnxruntime>=1.20,<2",
]

[tool.setuptools.packages.find]
include = ["replite*"]
exclude = ["models*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not network and not cuda'"
markers = [
    "network: tests that download pretrained weights over the network (run with pytest -m network)",
    "cuda: tests that require an NVIDIA CUDA device (run with pytest -m cuda)",
]
